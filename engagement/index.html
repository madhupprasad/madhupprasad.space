<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Madhu & Anu · Engaged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fbf6ef; --fg:#3a1f1a; --muted:#8a6a5c; --gold:#b8862f; --maroon:#8e1f2f; --card:#fff; --shadow:0 8px 24px rgba(80,30,20,.14); }
  @media (prefers-color-scheme: dark) { :root { --bg:#17100d; --fg:#f6e9dc; --muted:#c4a593; --gold:#e0b25c; --maroon:#e0707f; --card:#241915; --shadow:0 8px 24px rgba(0,0,0,.5); } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 Inter,system-ui,sans-serif; overflow-x:hidden; }
  h1, h2, .serif { font-family:"Cormorant Garamond",Georgia,serif; font-weight:500; line-height:1.1; }
  em { font-style:italic; color:var(--gold); }

  /* Hero */
  .hero { position:relative; height:100vh; height:100dvh; min-height:520px; display:grid; align-items:end; color:#fff; overflow:hidden; }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%;
              animation:zoom 18s ease-out both; }
  @keyframes zoom { from { transform:scale(1.12); } to { transform:scale(1); } }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(20,8,5,.85), rgba(20,8,5,.15) 55%, rgba(20,8,5,.35)); }
  .hero-text { position:relative; z-index:2; padding:0 16px 12vh; text-align:center; width:100%; }
  .hero .kicker { letter-spacing:.35em; text-transform:uppercase; font-size:.8rem; opacity:.85; }
  .hero h1 { font-size:clamp(3.2rem,13vw,7rem); margin:.3rem 0; }
  .hero h1 em { color:#f3c977; }
  .hero .date { font-family:"Cormorant Garamond",serif; font-size:1.4rem; font-style:italic; opacity:.9; }
  .scroll { display:inline-block; margin-top:2rem; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; opacity:.7; animation:bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(6px); } }
  .petal { position:absolute; top:-5vh; z-index:1; width:10px; height:14px; border-radius:60% 0 60% 0; opacity:.8;
           animation:fall linear infinite; }
  @keyframes fall { to { transform:translate(var(--dx), 110vh) rotate(540deg); } }

  /* Chapters */
  section.chapter { max-width:1100px; margin:0 auto; padding:72px 16px 16px; }
  .head { text-align:center; max-width:36rem; margin:0 auto 32px; }
  .head .num { color:var(--gold); letter-spacing:.3em; font-size:.75rem; text-transform:uppercase; }
  .head h2 { font-size:clamp(2.2rem,7vw,3.4rem); margin:.25rem 0 .5rem; }
  .head p { color:var(--muted); }
  .divider { display:block; margin:12px auto 0; color:var(--gold); font-size:1.2rem; letter-spacing:.6em; }

  .masonry { columns:3 280px; column-gap:14px; }
  .masonry.few { columns:2 280px; }
  figure { break-inside:avoid; margin:0 0 14px; background:var(--card); padding:8px; border-radius:4px; box-shadow:var(--shadow);
           cursor:zoom-in; opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease; }
  figure.in { opacity:1; transform:none; }
  figure img { width:100%; display:block; border-radius:2px; aspect-ratio:3/2; object-fit:cover; background:#0001; }
  figure:hover img { filter:brightness(1.05); }
  figure:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }

  .feature { max-width:900px; margin:0 auto 14px; }
  .single { max-width:640px; margin:0 auto; }

  /* Closing */
  .closing { text-align:center; padding:96px 16px 64px; }
  .closing figure { max-width:640px; margin:0 auto 32px; }
  .closing h2 { font-size:clamp(2.4rem,8vw,4rem); }
  .closing p { color:var(--muted); margin-top:.75rem; font-size:1.1rem; }
  .sign { font-family:"Cormorant Garamond",serif; font-size:1.8rem; font-style:italic; color:var(--maroon); margin-top:1.5rem; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:0 16px 40px; }

  /* Lightbox */
  .lb { position:fixed; inset:0; z-index:50; background:rgba(10,5,3,.94); display:none; place-items:center; }
  .lb.open { display:grid; }
  .lb img { max-width:94vw; max-height:84vh; border-radius:4px; box-shadow:0 10px 40px #000; }
  .lb button { position:absolute; background:rgba(255,255,255,.12); color:#fff; border:0; width:48px; height:48px; border-radius:50%;
               font-size:1.6rem; cursor:pointer; display:grid; place-items:center; }
  .lb button:hover { background:rgba(255,255,255,.25); }
  .lb button:focus-visible { outline:2px solid #f3c977; }
  .lb .x { top:16px; right:16px; } .lb .prev { left:12px; top:50%; translate:0 -50%; } .lb .next { right:12px; top:50%; translate:0 -50%; }
  .lb .count { position:absolute; bottom:16px; left:0; right:0; text-align:center; color:#fffb; font-size:.85rem; }

  /* Music */
  .music { position:fixed; right:16px; bottom:16px; z-index:40; display:none; align-items:center; gap:8px;
           background:var(--maroon); color:#fff; border:0; border-radius:999px; padding:.7rem 1.1rem;
           font:500 .9rem Inter,system-ui,sans-serif; cursor:pointer; box-shadow:var(--shadow); }
  .music.ready { display:flex; }
  .music:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
  .bars { display:flex; gap:2px; align-items:flex-end; height:14px; }
  .bars i { width:3px; height:4px; background:currentColor; border-radius:1px; }
  .music.playing .bars i { animation:eq .9s ease-in-out infinite; }
  .music.playing .bars i:nth-child(2) { animation-delay:-.3s; } .music.playing .bars i:nth-child(3) { animation-delay:-.6s; }
  @keyframes eq { 50% { height:14px; } }

  @media (prefers-reduced-motion: reduce) {
    .hero img, .scroll, .petal { animation:none; } .petal { display:none; }
    figure { opacity:1; transform:none; transition:none; }
  }
</style>
</head>
<body>

<header class="hero">
  <img src="photos/IMG_1300.jpg" alt="Madhu and Anu showing their engagement rings">
  <div class="hero-text">
    <div class="kicker">We're engaged</div>
    <h1>Madhu <em>&</em> Anu</h1>
    <div class="date">28 October 2026</div>
    <div class="scroll">Scroll ↓</div>
  </div>
</header>

<main id="chapters"></main>

<section class="closing">
  <figure tabindex="0" data-src="photos/IMG_4996.jpg"><img src="photos/IMG_4996.jpg" alt="Rangoli at the end of the day" loading="lazy"></figure>
  <h2>Thank you</h2>
  <p>To everyone who came, blessed us, fed us and laughed with us — you made our day.</p>
  <div class="sign">Strawberry & Chellakutty 🍓</div>
</section>
<footer>Made with love by Madhu</footer>

<audio src="music.mp3" loop preload="auto"></audio>
<button class="music" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="label">Play our song</span></button>

<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img alt="">
  <button class="x" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous photo">‹</button>
  <button class="next" aria-label="Next photo">›</button>
  <div class="count"></div>
</div>

<script>
  const chapters = [
    { title: 'The <em>rings</em>', text: 'The moment it became official.', feature: 'IMG_1315',
      photos: ['IMG_1301', 'IMG_1272'], few: true },
    { title: 'Just the <em>two of us</em>', text: 'Jasmine in her hair, butterflies in our stomachs.',
      photos: ['IMG_1217', 'IMG_1204', 'IMG_1224', 'IMG_1191', 'IMG_1331'] },
    { title: 'Welcoming <em>everyone</em>', text: 'Folded hands, warm smiles, and so many hellos.',
      photos: ['IMG_1177', 'IMG_1178', 'IMG_1179', 'IMG_1367', 'IMG_1370', 'IMG_1373', 'IMG_1374', 'IMG_1375'] },
    { title: 'Our <em>families</em>', text: 'Two families, one very full house.',
      photos: ['IMG_1229', 'IMG_1231', 'IMG_1233', 'IMG_1235', 'IMG_1240', 'IMG_1241', 'IMG_1245', 'IMG_1248', 'IMG_1255', 'IMG_1256',
               'IMG_1261', 'IMG_1336', 'IMG_1377', 'IMG_1379', 'IMG_1381', 'IMG_1384', 'IMG_1385', 'IMG_1388', 'IMG_1404', 'IMG_1406', 'IMG_1427'] },
    { title: 'Something <em>sweet</em>', text: 'Because every good story ends with cake.', single: 'IMG_1392' },
  ];
  const fig = (id, alt) => `<figure tabindex="0" data-src="photos/${id}.jpg"><img src="photos/${id}.jpg" alt="${alt}" loading="lazy"></figure>`;
  document.getElementById('chapters').innerHTML = chapters.map((c, i) => `
    <section class="chapter">
      <div class="head"><div class="num">Chapter ${i + 1}</div><h2>${c.title}</h2><p>${c.text}</p><span class="divider" aria-hidden="true">✦ ✦ ✦</span></div>
      ${c.feature ? `<div class="feature">${fig(c.feature, 'Engagement photo')}</div>` : ''}
      ${c.single ? `<div class="single">${fig(c.single, 'Engagement cake')}</div>` : ''}
      ${c.photos ? `<div class="masonry${c.few ? ' few' : ''}">${c.photos.map(p => fig(p, 'Engagement photo')).join('')}</div>` : ''}
    </section>`).join('');

  // Fade photos in as they scroll into view.
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  const figs = [...document.querySelectorAll('figure')];
  figs.forEach(f => io.observe(f));

  // Falling petals over the hero.
  const hero = document.querySelector('.hero'), tints = ['#f3c977', '#f8a5b4', '#ffffff', '#e86a7a'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.style.cssText = `left:${Math.random() * 100}%;background:${tints[i % 4]};--dx:${(Math.random() - .5) * 200}px;` +
      `animation-duration:${8 + Math.random() * 8}s;animation-delay:${-Math.random() * 12}s`;
    hero.appendChild(p);
  }

  // Music: browsers block autoplay, so it starts on a tap. The button stays hidden if music.mp3 is missing.
  const audio = document.querySelector('audio'), music = document.querySelector('.music'), label = music.querySelector('.label');
  audio.addEventListener('canplay', () => music.classList.add('ready'), { once: true });
  const setPlaying = on => { music.classList.toggle('playing', on); music.setAttribute('aria-pressed', on); label.textContent = on ? 'Pause music' : 'Play our song'; };
  audio.addEventListener('play', () => setPlaying(true));
  audio.addEventListener('pause', () => setPlaying(false));
  music.addEventListener('click', () => {
    if (!audio.paused) return audio.pause();
    audio.volume = 0;
    audio.play().then(() => { const t = setInterval(() => { audio.volume = Math.min(1, audio.volume + .05); if (audio.volume >= 1) clearInterval(t); }, 80); });
  });

  // Lightbox with keyboard and swipe.
  const lb = document.querySelector('.lb'), lbImg = lb.querySelector('img'), count = lb.querySelector('.count');
  let at = 0, opener = null;
  const open = i => { at = (i + figs.length) % figs.length; lbImg.src = figs[at].dataset.src; lbImg.alt = figs[at].querySelector('img').alt;
                      count.textContent = `${at + 1} / ${figs.length}`; lb.classList.add('open'); lb.querySelector('.x').focus(); };
  const close = () => { lb.classList.remove('open'); opener && opener.focus(); };
  figs.forEach((f, i) => {
    f.addEventListener('click', () => { opener = f; open(i); });
    f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opener = f; open(i); } });
  });
  lb.querySelector('.x').onclick = close;
  lb.querySelector('.prev').onclick = () => open(at - 1);
  lb.querySelector('.next').onclick = () => open(at + 1);
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') open(at - 1); if (e.key === 'ArrowRight') open(at + 1);
  });
  let x0 = null;
  lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  lb.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) open(at + (dx < 0 ? 1 : -1)); x0 = null; });
</script>
</body>
</html>
