<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madhu Prasad</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --accent:#818cf8; } }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,sans-serif; }
  main { max-width:32rem; }
  h1 { font-size:2.5rem; letter-spacing:-0.02em; }
  p { color:var(--muted); margin-top:.5rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Madhu Prasad</h1>
  <p>Software engineer at Everstage. Something new is being built here — check back soon.</p>
  <p><a href="https://github.com/madhupprasad">GitHub</a></p>
</main>
</body>
</html>
